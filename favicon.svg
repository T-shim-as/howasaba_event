<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Deep Ice Night) -->
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="60%" stop-color="#0c1e33"/>
      <stop offset="100%" stop-color="#024e76"/>
    </linearGradient>

    <!-- Bubble Gradient (Frosty Chat Bubble) -->
    <linearGradient id="favBubble" x1="8" y1="8" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d2847"/>
      <stop offset="100%" stop-color="#071b30"/>
    </linearGradient>

    <!-- Ice Glow Gradient -->
    <linearGradient id="favIce" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Base App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Chat Bubble Tail -->
  <path d="M 14 47 L 6 56 L 22 50 Z" fill="#071b30" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
  <!-- Chat Bubble Body -->
  <rect x="7" y="9" width="50" height="42" rx="9" fill="url(#favBubble)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Matrix Header Dots / Columns (Mon, Tue, Wed, Thu, Fri) -->
  <rect x="13" y="14" width="6" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="22" y="14" width="6" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="31" y="14" width="6" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="40" y="14" width="6" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>

  <!-- Horizontal Divider Line -->
  <line x1="11" y1="21" x2="53" y2="21" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="1 1.5"/>

  <!-- Row 1: [- | O | - | 🔴] -->
  <!-- Col 1: Hyphen -->
  <line x1="13" y1="28" x2="19" y2="28" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Sep 1 -->
  <line x1="21.5" y1="24" x2="21.5" y2="32" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 2: Circle (O) -->
  <circle cx="26" cy="28" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Sep 2 -->
  <line x1="30.5" y1="24" x2="30.5" y2="32" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 3: Hyphen -->
  <line x1="33" y1="28" x2="39" y2="28" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Sep 3 -->
  <line x1="41.5" y1="24" x2="41.5" y2="32" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 4: Overlap Circle (🔴) -->
  <circle cx="47" cy="28" r="3.2" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>

  <!-- Row 2: [O | - | 🔴 | O] -->
  <!-- Col 1: Circle (O) -->
  <circle cx="16" cy="39" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Sep 1 -->
  <line x1="21.5" y1="35" x2="21.5" y2="43" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 2: Hyphen -->
  <line x1="23" y1="39" x2="29" y2="39" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <!-- Sep 2 -->
  <line x1="30.5" y1="35" x2="30.5" y2="43" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 3: Circle (O) -->
  <circle cx="36" cy="39" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Sep 3 -->
  <line x1="41.5" y1="35" x2="41.5" y2="43" stroke="#0369a1" stroke-width="1.2"/>
  <!-- Col 4: Circle (O) -->
  <circle cx="47" cy="39" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

  <!-- Snowflake Emblem on Top-Right Corner -->
  <g transform="translate(47, 8) scale(0.68)">
    <circle cx="10" cy="10" r="10" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Snowflake Lines -->
    <line x1="10" y1="3" x2="10" y2="17" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="3" y1="10" x2="17" y2="10" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="5" y1="5" x2="15" y2="15" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="5" x2="5" y2="15" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="10" cy="10" r="2" fill="#ffffff"/>
  </g>
</svg>