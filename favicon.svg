<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Bubble Gradient (Deep Frosty Ice Blue) -->
    <linearGradient id="favBubbleGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2a4a"/>
      <stop offset="60%" stop-color="#071b30"/>
      <stop offset="100%" stop-color="#030d1a"/>
    </linearGradient>
  </defs>

  <!-- Large Chat Bubble Shape (Tail at Bottom-Right, 45-degree angle) -->
  <path d="M 15 5
           L 49 5
           A 9 9 0 0 1 58 14
           L 58 39
           A 9 9 0 0 1 49 48
           L 47 48
           L 57 58
           L 37 48
           L 15 48
           A 9 9 0 0 1 6 39
           L 6 14
           A 9 9 0 0 1 15 5
           Z"
        fill="url(#favBubbleGrad)"
        stroke="#38bdf8"
        stroke-width="2.4"
        stroke-linejoin="round"/>

  <!-- Table Header -->
  <!-- Left Item Column Header (Event label pill) -->
  <rect x="11.5" y="13" width="9.5" height="3" rx="1.5" fill="#38bdf8" fill-opacity="0.9"/>
  <!-- Date Column Indicators (Mon, Tue, Wed, Thu) -->
  <rect x="26" y="13" width="4" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="33" y="13" width="4" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="40" y="13" width="4" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="47" y="13" width="4" height="3" rx="1.5" fill="#7dd3fc" fill-opacity="0.9"/>

  <!-- Horizontal Table Divider -->
  <line x1="9.5" y1="19.5" x2="53.5" y2="19.5" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="1.2 1.5"/>

  <!-- Vertical Divider (Item Column | Schedule Columns) -->
  <line x1="23.5" y1="22" x2="23.5" y2="44.5" stroke="#0369a1" stroke-width="1.3"/>

  <!-- Row 1: Event Label Tag + [- | O | 🔴 | O] -->
  <rect x="11" y="25.5" width="10" height="5.5" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="13" y1="28.2" x2="19" y2="28.2" stroke="#e0f2fe" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Col 1: Hyphen (-) -->
  <line x1="26" y1="28.2" x2="30" y2="28.2" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Col 2: Circle (O) -->
  <circle cx="35" cy="28.2" r="2.6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Col 3: Overlap Dot (🔴) -->
  <circle cx="42" cy="28.2" r="3.0" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>
  <!-- Col 4: Circle (O) -->
  <circle cx="49" cy="28.2" r="2.6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>

  <!-- Row 2: Event Label Tag + [O | - | O | -] -->
  <rect x="11" y="36.5" width="10" height="5.5" rx="2" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="13" y1="39.2" x2="18" y2="39.2" stroke="#e0f2fe" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Col 1: Circle (O) -->
  <circle cx="28" cy="39.2" r="2.6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Col 2: Hyphen (-) -->
  <line x1="33" y1="39.2" x2="37" y2="39.2" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Col 3: Circle (O) -->
  <circle cx="42" cy="39.2" r="2.6" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <!-- Col 4: Hyphen (-) -->
  <line x1="47" y1="39.2" x2="51" y2="39.2" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Snowflake Emblem on Top-Left Corner -->
  <g transform="translate(2, 2)">
    <circle cx="8" cy="8" r="7.5" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Snowflake Lines -->
    <line x1="8" y1="2.5" x2="8" y2="13.5" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="2.5" y1="8" x2="13.5" y2="8" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="4" x2="12" y2="12" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="12" y1="4" x2="4" y2="12" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="1.4" fill="#ffffff"/>
  </g>
</svg>
