<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Bubble Gradient (Deep Frosty Ice Blue) -->
    <linearGradient id="favBubbleGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e2a4a"/>
      <stop offset="60%" stop-color="#071b30"/>
      <stop offset="100%" stop-color="#030d1a"/>
    </linearGradient>

    <!-- Snowflake Glow Gradient -->
    <linearGradient id="favSnowGrad" x1="4" y1="4" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Large Chat Bubble Shape (Tail at Bottom-Right) -->
  <path d="M 14 5
           L 50 5
           A 9 9 0 0 1 59 14
           L 59 42
           A 9 9 0 0 1 50 51
           L 44 51
           L 58 60
           L 39 51
           L 14 51
           A 9 9 0 0 1 5 42
           L 5 14
           A 9 9 0 0 1 14 5
           Z"
        fill="url(#favBubbleGrad)"
        stroke="#38bdf8"
        stroke-width="2.4"
        stroke-linejoin="round"/>

  <!-- Matrix Header Dots / Columns -->
  <rect x="23" y="13" width="5" height="2.5" rx="1.2" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="31" y="13" width="5" height="2.5" rx="1.2" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="39" y="13" width="5" height="2.5" rx="1.2" fill="#7dd3fc" fill-opacity="0.9"/>
  <rect x="47" y="13" width="5" height="2.5" rx="1.2" fill="#7dd3fc" fill-opacity="0.9"/>

  <!-- Divider Line -->
  <line x1="10" y1="20" x2="54" y2="20" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="1.2 1.5"/>

  <!-- Row 1: [- | O | - | 🔴 | O] -->
  <line x1="12" y1="28" x2="18" y2="28" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="20.5" y1="23" x2="20.5" y2="33" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="25.5" cy="28" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <line x1="29.5" y1="23" x2="29.5" y2="33" stroke="#0369a1" stroke-width="1.2"/>
  <line x1="32" y1="28" x2="38" y2="28" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="40.5" y1="23" x2="40.5" y2="33" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="46.5" cy="28" r="3.2" fill="#ef4444" stroke="#fca5a5" stroke-width="1"/>
  <line x1="51.5" y1="23" x2="51.5" y2="33" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="55" cy="28" r="2.2" stroke="#38bdf8" stroke-width="1.5" fill="none"/>

  <!-- Row 2: [O | - | O | O | -] -->
  <circle cx="15" cy="40" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <line x1="20.5" y1="35" x2="20.5" y2="45" stroke="#0369a1" stroke-width="1.2"/>
  <line x1="23" y1="40" x2="29" y2="40" stroke="#64748b" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="29.5" y1="35" x2="29.5" y2="45" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="35" cy="40" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <line x1="40.5" y1="35" x2="40.5" y2="45" stroke="#0369a1" stroke-width="1.2"/>
  <circle cx="46.5" cy="40" r="3" stroke="#38bdf8" stroke-width="1.8" fill="none"/>
  <line x1="51.5" y1="35" x2="51.5" y2="45" stroke="#0369a1" stroke-width="1.2"/>
  <line x1="53" y1="40" x2="57" y2="40" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

  <!-- Snowflake Emblem on Top-Left Corner -->
  <g transform="translate(3, 3)">
    <circle cx="8" cy="8" r="8" fill="#082f49" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Snowflake Lines -->
    <line x1="8" y1="2.5" x2="8" y2="13.5" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="2.5" y1="8" x2="13.5" y2="8" stroke="#e0f2fe" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="4" y1="4" x2="12" y2="12" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="12" y1="4" x2="4" y2="12" stroke="#7dd3fc" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="8" cy="8" r="1.6" fill="#ffffff"/>
  </g>
</svg>